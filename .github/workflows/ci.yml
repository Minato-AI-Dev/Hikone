name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Backend types
        run: npm run typecheck:api
      - name: Build
        env:
          VITE_WALKING_ROUTE_ENDPOINT: https://routing-ci.example/api/walking-routes
        run: npm run build:pages

  dependency-repair:
    if: github.head_ref == 'fix/audit-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose and prepare non-breaking dependency repair
        run: node scripts/prepare-dependency-repair.mjs
