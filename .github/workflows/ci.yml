name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit, tests and backend types
        run: node scripts/check-release.mjs
      - name: Build
        env:
          VITE_WALKING_ROUTE_ENDPOINT: https://routing-ci.example/api/walking-routes
        run: npm run build:pages

